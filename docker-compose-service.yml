name: lumenx-production

# 漫屿AIGC 生产 Web 栈（PC）。本文件包含 PostgreSQL、Redis 和应用服务。
# OSS 仍使用外部私有对象存储；生产环境必须配置 OSS endpoint、bucket 和凭据。
# 所有密码/API key 都通过 secrets/*.txt 注入，禁止写入 .env 或 Compose 文件。
#
# 首次部署：
#   1. 创建 secrets/postgres_password.txt、postgres_app_password.txt、
#      bootstrap_admin_password.txt、session_secret.txt 及供应商/OSS secret。
#   2. 设置 .env 中的 LUMENX_ALLOWED_ORIGINS、OSS 配置和 XLINKS_BASE_URL。
#   3. 首次或后端更新：docker compose -f docker-compose-service.yml up -d --build
#      前端发布请先在本地构建镜像，再叠加 docker-compose-service-prebuilt.yml，
#      避免在生产服务器执行 Node/npm 构建。
#
# 生产默认关闭注册和新 AI 任务。完成灰度、对账和供应商验证后，再通过受控
# 配置发布解除对应熔断；不要通过修改历史数据库配置绕过策略。

x-cloud-environment: &cloud-environment
  LUMENX_DEPLOYMENT_MODE: cloud
  LUMENX_DATABASE_HOST: postgres
  LUMENX_DATABASE_PORT: "5432"
  LUMENX_DATABASE_NAME: ${POSTGRES_DB:-lumenx}
  LUMENX_DATABASE_USER: ${LUMENX_DATABASE_USER:-lumenx_app}
  LUMENX_DATABASE_PASSWORD_FILE: /run/secrets/database_app_password
  LUMENX_DATABASE_RESOURCE_ID: ${LUMENX_DATABASE_RESOURCE_ID:-lumenx-postgres}
  LUMENX_REDIS_URL: ${LUMENX_REDIS_URL:-redis://redis:6379/0}
  LUMENX_REDIS_RESOURCE_ID: ${LUMENX_REDIS_RESOURCE_ID:-lumenx-redis}
  LUMENX_OSS_ENDPOINT: ${LUMENX_OSS_ENDPOINT:?请设置 LUMENX_OSS_ENDPOINT}
  LUMENX_OSS_BUCKET_NAME: ${LUMENX_OSS_BUCKET_NAME:?请设置 LUMENX_OSS_BUCKET_NAME}
  LUMENX_OSS_ACCESS_KEY_ID_FILE: /run/secrets/oss_access_key_id
  LUMENX_OSS_ACCESS_KEY_SECRET_FILE: /run/secrets/oss_access_key_secret
  LUMENX_OSS_PRIVATE: "true"
  LUMENX_SESSION_SECRET_FILE: /run/secrets/session_secret
  LUMENX_MODEL_CATALOG_PATH: /app/config/model_catalog/generated/model_catalog.json
  LUMENX_PROVIDER_SECRET_REFS: ${LUMENX_PROVIDER_SECRET_REFS:-DASHSCOPE_API_KEY,XLINKS_API_KEY}
  LUMENX_PROVIDER_ACCOUNT_ID: ${LUMENX_PROVIDER_ACCOUNT_ID:-}
  LUMENX_LOCAL_IMPORT_ROOT: /imports
  LUMENX_LOCAL_IMPORT_MAX_BYTES: ${LUMENX_LOCAL_IMPORT_MAX_BYTES:-10737418240}
  LUMENX_PROVIDER_OUTPUT_ROOT: /provider-results
  LUMENX_ALLOWED_ORIGINS: ${LUMENX_ALLOWED_ORIGINS:?请设置 LUMENX_ALLOWED_ORIGINS}
  LUMENX_REGISTRATION_EMERGENCY_DISABLED: ${LUMENX_REGISTRATION_EMERGENCY_DISABLED:-true}
  LUMENX_NEW_AI_TASKS_EMERGENCY_DISABLED: ${LUMENX_NEW_AI_TASKS_EMERGENCY_DISABLED:-true}
  LUMENX_ADMIN_CONSOLE_ENABLED: ${LUMENX_ADMIN_CONSOLE_ENABLED:-true}
  LUMENX_ADMIN_CONSOLE_MUTATIONS_ENABLED: ${LUMENX_ADMIN_CONSOLE_MUTATIONS_ENABLED:-true}
  LUMENX_ADMIN_RATE_WINDOW_SECONDS: ${LUMENX_ADMIN_RATE_WINDOW_SECONDS:-60}
  LUMENX_ADMIN_MUTATION_LIMIT: ${LUMENX_ADMIN_MUTATION_LIMIT:-120}
  LUMENX_ADMIN_SENSITIVE_READ_LIMIT: ${LUMENX_ADMIN_SENSITIVE_READ_LIMIT:-60}
  LUMENX_ADMIN_EXPORT_LIMIT: ${LUMENX_ADMIN_EXPORT_LIMIT:-20}
  DASHSCOPE_API_KEY_FILE: /run/secrets/dashscope_api_key
  XLINKS_API_KEY_FILE: /run/secrets/xlinks_api_key
  XLINKS_BASE_URL: ${XLINKS_BASE_URL:-https://api.xlinks.site/v1}
  NO_PROXY: "*.aliyuncs.com,localhost,127.0.0.1,postgres,redis"

x-cloud-secrets: &cloud-secrets
  - database_app_password
  - session_secret
  - oss_access_key_id
  - oss_access_key_secret
  - dashscope_api_key
  - xlinks_api_key

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumenx}
      POSTGRES_USER: ${POSTGRES_USER:-lumenx_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/database_admin_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - database_admin_password
    volumes:
      - lumenx-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    logging: *default-logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1000"
    volumes:
      - lumenx-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 30s
    restart: unless-stopped

  # Creates/repairs the least-privileged application role before migrations.
  database-role-bootstrap:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres-tools
    logging: *default-logging
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-lumenx}
      POSTGRES_USER: ${POSTGRES_USER:-lumenx_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/database_admin_password
      LUMENX_DATABASE_USER: ${LUMENX_DATABASE_USER:-lumenx_app}
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/database_app_password
    secrets:
      - database_admin_password
      - database_app_password
    entrypoint: ["/bin/sh", "/usr/local/bin/lumenx-postgres-app-role"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Migrations run with the PostgreSQL administrator, never the application role.
  migration:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    logging: *default-logging
    environment:
      LUMENX_DEPLOYMENT_MODE: cloud
      LUMENX_DATABASE_HOST: postgres
      LUMENX_DATABASE_PORT: "5432"
      LUMENX_DATABASE_NAME: ${POSTGRES_DB:-lumenx}
      LUMENX_DATABASE_USER: ${POSTGRES_USER:-lumenx_admin}
      LUMENX_DATABASE_PASSWORD_FILE: /run/secrets/database_admin_password
    secrets:
      - database_admin_password
    command: ["alembic", "upgrade", "head"]
    depends_on:
      database-role-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  # Idempotent first-admin creation. The password is read only from a secret file.
  admin-bootstrap:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    logging: *default-logging
    environment:
      <<: *cloud-environment
      LUMENX_BOOTSTRAP_ADMIN_USERNAME: ${LUMENX_BOOTSTRAP_ADMIN_USERNAME:-admin}
      LUMENX_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      LUMENX_ALLOW_DEFAULT_BOOTSTRAP_ADMIN_PASSWORD: "false"
      LUMENX_BOOTSTRAP_ADMIN_ADOPT_EXISTING_SOLE: "false"
    secrets:
      - database_app_password
      - session_secret
      - oss_access_key_id
      - oss_access_key_secret
      - dashscope_api_key
      - xlinks_api_key
      - bootstrap_admin_password
    command:
      - python
      - -m
      - src.platform.bootstrap_admin
      - --username
      - ${LUMENX_BOOTSTRAP_ADMIN_USERNAME:-admin}
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: "no"

  # Seeds the initial safe registration policy. Changing it later is an audited
  # admin operation; the emergency environment flag can only disable access.
  registration-mode-bootstrap:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    logging: *default-logging
    environment:
      <<: *cloud-environment
      LUMENX_BOOTSTRAP_REGISTRATION_MODE: ${LUMENX_BOOTSTRAP_REGISTRATION_MODE:-disabled}
    secrets: *cloud-secrets
    command:
      - python
      - scripts/set_registration_mode.py
      - --reason
      - ${LUMENX_BOOTSTRAP_REGISTRATION_REASON:-生产栈初始化注册策略}
    depends_on:
      admin-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    logging: *default-logging
    environment: *cloud-environment
    secrets: *cloud-secrets
    volumes:
      - lumenx-app-output:/app/output
      - lumenx-local-imports:/imports:ro
    expose:
      - "17177"
    depends_on:
      registration-mode-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:17177/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ai-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    logging: *default-logging
    environment: *cloud-environment
    secrets: *cloud-secrets
    command: ["celery", "-A", "src.platform.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=${LUMENX_GLOBAL_WORKER_CONCURRENCY:-8}"]
    volumes:
      - lumenx-provider-results:/provider-results
    depends_on:
      registration-mode-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/lumenx-cloud-entrypoint celery -A src.platform.worker:celery_app inspect ping -d celery@$${HOSTNAME} --timeout=5"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  maintenance-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    logging: *default-logging
    environment: *cloud-environment
    secrets: *cloud-secrets
    command: ["celery", "-A", "src.platform.worker:celery_app", "worker", "--loglevel=INFO", "--queues=maintenance", "--concurrency=1"]
    volumes:
      - lumenx-postgres-backups:/backups:ro
    depends_on:
      registration-mode-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    logging: *default-logging
    environment: *cloud-environment
    secrets: *cloud-secrets
    command: ["celery", "-A", "src.platform.worker:celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      registration-mode-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres-backup:
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres-tools
    logging: *default-logging
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-lumenx}
      POSTGRES_USER: ${POSTGRES_USER:-lumenx_admin}
      POSTGRES_PASSWORD_FILE: /run/secrets/database_admin_password
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    secrets:
      - database_admin_password
    volumes:
      - lumenx-postgres-backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/lumenx-postgres-backup"]
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: ${LUMENX_FRONTEND_IMAGE:-lumenx-frontend:local}
    # 本地镜像不存在时直接失败，不要在生产服务器隐式拉取或重新构建。
    pull_policy: never
    logging: *default-logging
    environment:
      LUMENX_LEGACY_API_COMPAT: ${LUMENX_LEGACY_API_COMPAT:-false}
    ports:
      - "${LUMENX_BIND_ADDRESS:-127.0.0.1}:${LUMENX_SERVICE_PORT:-3000}:80"
    volumes:
      - lumenx-nginx-legacy-logs:/var/log/lumenx
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  lumenx-postgres-data:
  lumenx-redis-data:
  lumenx-app-output:
  lumenx-local-imports:
  lumenx-provider-results:
  lumenx-postgres-backups:
  lumenx-nginx-legacy-logs:

secrets:
  database_admin_password:
    file: ${LUMENX_DATABASE_ADMIN_PASSWORD_FILE:-./secrets/postgres_password.txt}
  database_app_password:
    file: ${LUMENX_DATABASE_APP_PASSWORD_FILE:-./secrets/postgres_app_password.txt}
  bootstrap_admin_password:
    file: ${LUMENX_BOOTSTRAP_ADMIN_PASSWORD_FILE:-./secrets/bootstrap_admin_password.txt}
  session_secret:
    file: ${LUMENX_SESSION_SECRET_FILE:-./secrets/session_secret.txt}
  oss_access_key_id:
    file: ${LUMENX_OSS_ACCESS_KEY_ID_FILE:-./secrets/oss_access_key_id.txt}
  oss_access_key_secret:
    file: ${LUMENX_OSS_ACCESS_KEY_SECRET_FILE:-./secrets/oss_access_key_secret.txt}
  dashscope_api_key:
    file: ${DASHSCOPE_API_KEY_FILE:-./secrets/dashscope_api_key.txt}
  xlinks_api_key:
    file: ${XLINKS_API_KEY_FILE:-./secrets/xlinks_api_key.txt}
