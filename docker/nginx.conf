server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/lumenx-security-headers.conf;

    # The cloud browser has one API contract. The trailing slash on
    # proxy_pass intentionally strips /api/v1 before the internal FastAPI hop.
    location = /api/v1 {
        return 308 /api/v1/;
    }

    location /api/v1/ {
        proxy_pass http://backend:17177/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
        client_max_body_size 100M;
    }

    # Generated at container startup and empty when compatibility is disabled.
    include /etc/nginx/lumenx-compat.d/*.conf;

    location /_next/static/ {
        include /etc/nginx/snippets/lumenx-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML is never cached across an API compatibility rollout.
    location / {
        include /etc/nginx/snippets/lumenx-security-headers.conf;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
