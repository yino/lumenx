name: Cloud release check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q src scripts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run build

  deployed-stack:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      COMPOSE_PROJECT_NAME: lumenx-release-${{ github.run_id }}-${{ github.run_attempt }}
      LUMENX_RELEASE_REVISION: ${{ github.sha }}
      LUMENX_RELEASE_TEST_SUMMARY: backend、前端、类型检查、生产构建及部署栈均通过
      LUMENX_RELEASE_ARTIFACTS_DIR: ./release-artifacts
      LUMENX_POSTGRES_PASSWORD_FILE: ./secrets/postgres_password.txt
      LUMENX_POSTGRES_APP_PASSWORD_FILE: ./secrets/postgres_app_password.txt
      LUMENX_SESSION_SECRET_FILE: ./secrets/session_secret.txt
      LUMENX_OSS_ACCESS_KEY_ID_FILE: ./secrets/oss_access_key_id.txt
      LUMENX_OSS_ACCESS_KEY_SECRET_FILE: ./secrets/oss_access_key_secret.txt
      DASHSCOPE_API_KEY_FILE: ./secrets/dashscope_api_key.txt
      LUMENX_RELEASE_TEST_SIGNING_SECRET_FILE: ./.release-secrets/release_test_signing_secret.txt
    steps:
      - uses: actions/checkout@v4
      - name: 创建一次性测试密钥
        run: |
          mkdir -p secrets .release-secrets release-artifacts
          openssl rand -hex 32 > secrets/postgres_password.txt
          openssl rand -hex 32 > secrets/postgres_app_password.txt
          openssl rand -hex 32 > secrets/session_secret.txt
          openssl rand -hex 32 > secrets/oss_access_key_id.txt
          openssl rand -hex 32 > secrets/oss_access_key_secret.txt
          openssl rand -hex 32 > secrets/dashscope_api_key.txt
          openssl rand -hex 32 > .release-secrets/release_test_signing_secret.txt
          chmod 600 secrets/*.txt .release-secrets/*.txt
      - name: 静态配置检查
        run: |
          docker compose -f docker-compose.yml -f docker-compose.release.yml --profile release-test config --quiet
          sh -n docker/*.sh
      - name: 构建镜像并检查 Nginx
        run: |
          docker compose -f docker-compose.yml -f docker-compose.release.yml build backend ai-worker frontend release-smoke release-migration-check
          docker compose -f docker-compose.yml -f docker-compose.release.yml run --rm --no-deps \
            --entrypoint /bin/sh frontend -c \
            'printf "127.0.0.1 backend\n" >> /etc/hosts && exec /docker-entrypoint.sh nginx -t'
      - name: PostgreSQL 16 迁移链与旧配置升级
        run: docker compose -f docker-compose.yml -f docker-compose.release.yml --profile release-test run --rm release-migration-check
      - name: 浏览器来源部署栈验收
        run: |
          docker compose -f docker-compose.yml -f docker-compose.release.yml --profile release-test up --abort-on-container-exit --exit-code-from release-smoke release-smoke
      - name: 失败日志
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.release.yml --profile release-test logs --no-color --tail=300
      - name: 上传中文发布证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-release-evidence-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: warn
      - name: 清理一次性部署栈
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.release.yml --profile release-test down --volumes --remove-orphans
